name: Publicar Datapack Automatizado

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Número de versión del Datapack (ej. 1.1)'
        required: true
        default: '1.1'
  push:
    branches:
      - releases

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Crear archivo .ZIP del Datapack
        run: |
          # Si se activa por push usa '1.0' por defecto, si es manual usa el input
          VERSION="${{ github.event.inputs.version_number || '1.1' }}"
          
          # Empaqueta usando el nombre dinámico: everyday-wear-1.1.zip
          zip -r "everyday-wear-${VERSION}.zip" data pack.mcmeta pack.png -x "*.git*" "*.github*"

      - name: Publicar en CurseForge y Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          # Claves secretas de GitHub
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # IDs de tus proyectos
          curseforge-id: '1651937'
          modrinth-id: 'everyday-wear'

          # CORREGIDO: Comillas dobles fuera, comillas simples dentro de ${{ }}
          files: "everyday-wear-${{ github.event.inputs.version_number || '1.1' }}.zip"
          version: "${{ github.event.inputs.version_number || '1.1' }}"
          version-type: 'release' # Puede ser: release, beta, alpha

          # Compatibilidad corregida para la versión de Minecraft
          game-versions: '26.2'
          loaders: 'datapack'
