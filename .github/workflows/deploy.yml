name: Publicar Datapack Automatizado

on:
  push:
    branches:
      - [cite_start]releases # Solo se activa al hacer push o merge a 'releases' [cite: 344]
  workflow_dispatch: # <-- Esto habilita el botón manual en GitHub
    push:
      branches:
        - releases # Se activa automáticamente al subir a 'releases'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        [cite_start]uses: actions/checkout@v4 [cite: 345]

      - name: Crear archivo .ZIP del Datapack
        run: |
          # Empaqueta la carpeta data, pack.mcmeta e imagen ignorando carpetas de Git
          zip -r datapack_casual.zip data pack.mcmeta pack.png -x "*.git*" "*.github*" [cite: 346]

      - name: Publicar en CurseForge y Modrinth
        uses: FirstDarkDev/modpublisher@v2
        with:
          # Claves secretas de GitHub
          [cite_start]curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }} [cite: 344, 346]
          [cite_start]modrinth-token: ${{ secrets.MODRINTH_TOKEN }} [cite: 344, 347]

          # IDs de tus proyectos (Cámbialos por los tuyos)
          curseforge-id: '1651937'
          modrinth-id: 'everyday-wear'
          
          # Configuración del archivo
          files: 'datapack_casual.zip'
          version-type: 'release'        # Puede ser: release, beta, alpha

          # Compatibilidad
          game-versions: '26.2'        # Cambia a la versión objetivo de tu datapack
          loaders: 'datapack'
