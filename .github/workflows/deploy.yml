name: Publicar Datapack Automatizado
on:
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Número de versión del Datapack (ej. 1.1)'
        required: true
        default: '1.1'
      changelog:
        description: 'Notas de la versión (Changelog)'
        required: true
        default: 'Corrección de errores y mejoras generales.'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Crear archivo .ZIP del Datapack
        run: |
          VERSION="${{ github.event.inputs.version_number }}"
          zip -r "everyday-wear-${VERSION}.zip" data pack.mcmeta pack.png -x "*.git*" "*.github*"

      - name: Publicar en CurseForge y Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          # Claves secretas de GitHub
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          
          # IDs de tus proyectos
          curseforge-id: '1651937'
          modrinth-id: 'everyday-wear'
          
          # Archivos y versiones
          files: "everyday-wear-${{ github.event.inputs.version_number }}.zip"
          version: "${{ github.event.inputs.version_number }}"
          version-type: 'release' 
          
          # NUEVO: Envía el texto ingresado en la interfaz al changelog de las plataformas
          changelog: "${{ github.event.inputs.changelog }}"
          
          # Versiones de Minecraft y cargador
          game-versions: '1.21'
          loaders: 'datapack'
